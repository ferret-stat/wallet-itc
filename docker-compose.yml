
services:
  db:
    image: postgres:16-alpine
    container_name: wallet_db
    environment:
      POSTGRES_DB: ${POSTGRE_NAME}
      POSTGRES_USER: ${POSTGRE_USER}
      POSTGRES_PASSWORD: ${POSTGRE_PASS}
    ports:
      - "${POSTGRE_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRE_USER} -d ${POSTGRE_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
